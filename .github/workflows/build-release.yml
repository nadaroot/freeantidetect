name: Build and Release Windows Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executables (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller rich

      - name: Build RootDetect-Web and RootDetect-CLI
        run: |
          python build_standalone.py --target all

      - name: Verify Executables
        shell: pwsh
        run: |
          if (!(Test-Path "dist\RootDetect-Web.exe")) {
            Write-Error "RootDetect-Web.exe was not created!"
            exit 1
          }
          if (!(Test-Path "dist\RootDetect-CLI.exe")) {
            Write-Error "RootDetect-CLI.exe was not created!"
            exit 1
          }
          Get-ChildItem -Path dist\

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RootDetect-Windows-Executables
          path: dist/*.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Root Detect Release ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ### 🚀 Root Detect — Автономный антидетект-браузер

            **Что нового в этом релизе:**
            - 🌐 **RootDetect-Web.exe** — Запуск локального графического веб-интерфейса (Dashboard) в один клик.
            - 💻 **RootDetect-CLI.exe** — Терминальная версия (TUI) с поддержкой всех команд.
            - 🛡️ Чистый Chromium & Gecko движки без предупреждений тестирования и баннеров.
            - 🎭 Встроенные пресеты отпечатков (Windows, macOS Sonoma/Sequoia, iOS 18 Safari, Android S24/Pixel 8, Linux).
            - ⚡ Автономность: нулевые внешние зависимости, локальное хранилище профилей.

            #### 📥 Скачать для Windows:
            - **`RootDetect-Web.exe`** (Рекомендуется для большинства пользователей)
            - **`RootDetect-CLI.exe`** (Для любителей консоли)
          files: |
            dist/RootDetect-Web.exe
            dist/RootDetect-CLI.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
